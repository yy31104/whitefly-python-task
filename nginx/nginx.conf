map $http_x_request_id $whitefly_request_id {
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
    default $request_id;
    "" $request_id;
}

log_format whitefly_json escape=json
    '{"timestamp":"$time_iso8601","level":"info","logger":"nginx.access","message":"request","request_id":"$whitefly_request_id","nginx_request_id":"$request_id","method":"$request_method","path":"$uri","request_uri":"$request_uri","status":$status,"duration_seconds":$request_time,"remote_addr":"$remote_addr","upstream_addr":"$upstream_addr","upstream_status":"$upstream_status"}';

access_log /var/log/nginx/access.log whitefly_json;

server {
    listen 80;
    server_name _;

    location = / {
        return 302 /flask/;
    }

    location = /flask {
        return 301 /flask/;
    }

    location = /fastapi {
        return 301 /fastapi/;
    }

    location /flask/ {
        proxy_pass http://flask_app:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-ID $whitefly_request_id;
    }

    location /fastapi/ {
        proxy_pass http://fastapi_app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-ID $whitefly_request_id;
    }
}

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Test local SQLite and mocked-service behavior
        run: python -m pytest -q
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: black --check .

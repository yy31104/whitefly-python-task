name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Test local SQLite and mocked-service behavior
        run: python -m pytest -q
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: black --check .

  postgres:
    # The same suite with every init_database() engine redirected to PostgreSQL
    # (see tests/conftest.py). Alembic-vs-create_all and _build_engine unit tests
    # keep their own SQLite engines.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: whitefly
          POSTGRES_PASSWORD: whitefly
          POSTGRES_DB: whitefly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whitefly -d whitefly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://whitefly:whitefly@localhost:5432/whitefly_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Test against PostgreSQL
        run: python -m pytest -q

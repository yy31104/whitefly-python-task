# OpenTelemetry Collector: receive OTLP from the apps and the worker,
# batch, and forward to Jaeger. The debug exporter prints a one-line summary
# per batch so `docker compose logs otel-collector` shows traffic.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
